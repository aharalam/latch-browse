[project]
name = "latch-browse"
version = "0.0.1"
description = "Guarded web research with Jac and an isolated security core"
entry-point = "main.jac"
kind = "web-app"

[plugins.byllm.model]
default_model = "${LLM_MODEL:-gemini/gemini-2.5-flash}"
api_key = "${GEMINI_API_KEY:-}"

[plugins.byllm.call_params]
max_output_retries = 0

[plugins.byllm.fallback]
num_retries = 0
timeout = 25.0


[jac-shadcn]
style = "lyra"
baseColor = "zinc"
theme = "amber"
font = "geist"
radius = "small"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
"@fontsource-variable/geist" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "1.1.10"
"@hugeicons/core-free-icons" = "4.3.3"
"@radix-ui/react-slot" = "1.3.3"
radix-ui = "1.6.7"
class-variance-authority = "0.7.1"
"@fontsource-variable/inter" = "5.3.0"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "1.8.0"
cmdk = "1.1.1"
embla-carousel-react = "8.6.0"
input-otp = "1.5.0"
react-day-picker = "10.0.1"
react-resizable-panels = "4.12.4"
recharts = "3.10.1"
sonner = "2.0.8"
vaul = "1.1.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "4.3.3"
"@tailwindcss/vite" = "4.3.3"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "LatchBrowse"
description = "The web can inform your agent. Not control it."
keywords = "jac, research, security"
author = "Team LatchBrowse"
theme_color = "#dc7702"
og_type = "website"
og_title = "LatchBrowse"
og_description = "Guarded web research"
og_site_name = "LatchBrowse"


[scale]
[scale.microservices]
enabled = false

[plugins.scale.admin]
enabled = false

[jacpack]
name = 'latch-browse-mvp'
description = 'Jac IDE snapshot for latch-browse-mvp'

[jachammer]
project_id = "prj_041ad8bce71547a7b012edd5c9a94d98"
